[tools]
# NOTE: Dependabot cannot read mise.toml. All four pins below -- the stable
# Rust toolchain, the nightly-2026-07-01 toolchain, cargo-deny, and
# cargo-fuzz -- are MANUAL bumps and receive no automated security PRs. Do
# not assume anything here is being watched for you.
#
# `components` is load-bearing, not decoration. Locally mise installs a full
# Rust distribution that already ships rustfmt and clippy, but in CI
# jdx/mise-action delegates to rustup, which installs the minimal profile
# without them -- so `mise run lint` passed on a laptop and failed on the
# runner with "cargo-fmt is not installed". Naming them here keeps the two
# environments resolving from one file, which is the point of mise-first.
#
# The second array entry is a second toolchain, not a second install of the
# same one: mise's rust backend has no separate "rust-nightly" tool, so a
# nightly pin lives as a second version of the `rust` tool. mise installs both
# through rustup and keeps the first entry (stable) active on PATH as plain
# `cargo`/`rustc`; the nightly is reached only via `cargo +<toolchain>`, which
# is how `mise run fuzz` gets to it. cargo-fuzz builds its targets with
# libFuzzer and sanitizer flags that only exist on nightly -- this pin is used
# by `mise run fuzz` and the fuzz workflow, nowhere else.
rust = [
  { version = "1.97.1", components = "rustfmt,clippy" },
  { version = "nightly-2026-07-01", components = "rustfmt,clippy" },
]
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-fuzz" = "0.13.2"

[env]
# The toolchain `cargo fuzz` builds targets with. Named here so `mise run fuzz`,
# `mise run fuzz-all`, and .github/workflows/fuzz.yml cannot drift apart. mise's
# rust backend installs it through rustup, which is what makes `cargo +<name>`
# resolve.
KASANE_FUZZ_TOOLCHAIN = "nightly-2026-07-01"

[tasks.build]
run = "cargo build --workspace"

# libtest captures stdout for passing tests and only shows it on failure or
# with `--nocapture`/`--show-output`. fuzz_corpus.rs's KNOWN_OPEN quarantine
# notice (see tests/fuzz_corpus.rs) is deliberately printed so a skipped
# reproducer is never silent -- but that only holds if this task actually
# surfaces it. Adding `--show-output` to the whole workspace run was tried
# and rejected: it roughly doubled total output (554 -> 1107 lines) with
# unrelated tests' `successes:` dumps (panicking-on-purpose tests, degrade
# warnings, etc.), which is worse noise than the problem it fixes. Instead,
# rerun just the one small, already-built fuzz_corpus binary with
# `--nocapture` -- 13 lines, always visible, no interleaving risk.
[tasks.test]
run = [
  "cargo test --workspace",
  "cargo test -p kasane-adapters --test fuzz_corpus -- --nocapture",
]

[tasks.lint]
run = ["cargo fmt --all -- --check",
       "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks.test-ocr]
run = [
  "cargo test --workspace --features ocr",
  "cargo test -p kasane-adapters --features ocr --test fuzz_corpus -- --nocapture",
]

[tasks.lint-ocr]
run = ["cargo fmt --all -- --check",
       "cargo clippy --workspace --all-targets --features ocr -- -D warnings"]

[tasks.convert]
run = "cargo run -p kasane-cli --"

# One command for both tiers. Blessing was a single `cargo test --test census`
# until the length-4 structural tier arrived; with two binaries to bless, a
# human who remembers only one leaves the other's files stale. That failure is
# loud -- CI fails on the un-blessed tier -- but this removes the trap rather
# than relying on the alarm, and gives AGENTS.md one command to name.
#
# It does NOT raise either permanence ceiling: a bless writes the shape files
# and stops, so a growing permanent file still leaves the test failing until a
# human raises the number in the same commit.
#
# `run` is fail-fast: mise stops at the first non-zero exit. Under
# KASANE_CENSUS_BLESS=1 the `census` binary still runs its own split test
# (`the_permanent_file_holds_exactly_the_five_condition_four_refusals`), which
# fails whenever the length-3 split moved -- exactly the moment you are
# blessing. That aborts here having rewritten the length-3 files and not the
# length-4 ones: a real but recoverable rough edge, loud (CI fails on the
# un-blessed tier) with an easy fix -- correct the split constant census.rs
# expects and re-run this task.
#
# Length 5 is here and RELEASE, unlike the two above: a debug bless of that
# tier costs ~3.3 min for the same file. Length 6 is NOT here and has nothing
# to bless -- it commits no files at all, because counts on a weekly cadence
# go stale on main (design spec §3.2).
[tasks.census-bless]
description = "Regenerate every census ratchet file, every tier"
run = [
  "KASANE_CENSUS_BLESS=1 cargo test -p kasane-writer --test census",
  "KASANE_CENSUS_BLESS=1 cargo test -p kasane-writer --test census_len4",
  "KASANE_CENSUS_BLESS=1 cargo test -p kasane-writer --release --test census_len5 -- --include-ignored",
]

# The length-5 tier, release profile. `#[ignore]`d in the source so
# `mise run test` (debug) skips it -- 35s here is 3.3 min there, for the same
# answer.
#
# `--include-ignored` rather than `--ignored`: the latter runs ONLY ignored
# tests, and this binary is meant to run whole.
[tasks.census-len5]
description = "Both census tiers plus the novelty check at length 5"
run = "cargo test -p kasane-writer --release --test census_len5 -- --include-ignored"

# The length-6 tier. ~10 min, so it lives in the weekly census-deep workflow
# rather than PR CI -- .github/workflows/census-deep.yml.
#
# It commits no files, so there is no census-bless line for it and
# `mise run census-ratchet` has nothing here to compare. Its guard is the
# tier's own assertion, which works the same on main as on a branch
# (design spec §3.2).
[tasks.census-len6]
description = "Both census tiers plus the novelty check at length 6 (~10 min)"
run = "cargo test -p kasane-writer --release --test census_len6 -- --include-ignored"

# The other half of the census ratchet. `cargo test` proves the allowlist files
# match reality (census.rs's `ratchet` fails in both directions); this proves
# they only ever got better. It compares committed file to committed file across
# revisions and never runs the census, which is what lets it be pure git+text --
# accuracy is inherited from the test.
#
# Not folded into `mise run test`: it needs a git history and a network fetch,
# which a plain `cargo test` must not.
[tasks.census-ratchet]
description = "The census allowlists may only shrink against main"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Every sort and every `comm` in this script must agree on collation, and
# `comm` reads the ambient locale rather than inheriting the `LC_ALL=C` a
# pipeline set. Exporting it once is what keeps them consistent -- without it
# `comm` rejects input this script sorted itself, on shapes containing `*`.
export LC_ALL=C

dir="crates/kasane-writer/tests"
text="$dir/census-known-corrupt.txt"
queue="$dir/census-known-structure-corrupt.txt"
perm="$dir/census-inexpressible.txt"
ceil="$dir/census-permanent-count.txt"
q4="$dir/census-len4-known-structure-corrupt.txt"
p4="$dir/census-len4-inexpressible.txt"
ceil4="$dir/census-len4-permanent-count.txt"
counts5="$dir/census-len5-counts.txt"

# The revision to measure against. On a PR this is the merge base with main; on
# a push to main it resolves to HEAD itself, so every set compares equal and the
# check passes without special-casing the branch. KASANE_RATCHET_BASE overrides
# it, which is how this task is exercised against real history.
base="${KASANE_RATCHET_BASE:-}"
if [ -z "$base" ]; then
  git fetch --quiet origin main 2>/dev/null || true
  base="$(git merge-base HEAD FETCH_HEAD 2>/dev/null \\
       || git merge-base HEAD origin/main 2>/dev/null \\
       || git merge-base HEAD main)"
fi
echo "base: $(git log -1 --format='%h %s' "$base")"
echo

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

# One file's shape lines, sorted for `comm`: comments and blanks dropped. awk
# rather than `grep -v`, which exits non-zero on an empty result and would trip
# `set -o pipefail`. Returns 1 when the path does not exist at that revision.
at_base() {
  git cat-file -e "$base:$1" 2>/dev/null || return 1
  git show "$base:$1" | awk '!/^#/ && NF' | LC_ALL=C sort -u
}
at_head() { awk '!/^#/ && NF' "$1" | LC_ALL=C sort -u; }

# One labelled count out of a counts file, at a revision or at HEAD. Prints
# nothing and returns 1 when the file or the label is absent, which is how the
# skip below is detected.
count_at() { # label path revision-or-empty
  local body
  if [ -n "$3" ]; then
    git cat-file -e "$3:$2" 2>/dev/null || return 1
    body="$(git show "$3:$2")"
  else
    [ -f "$2" ] || return 1
    body="$(cat "$2")"
  fi
  printf '%s\\n' "$body" | awk -v k="$1" '$1 == k { print $2; found = 1 }
                                          END { exit !found }'
}

for f in "$text" "$queue" "$perm" "$q4" "$p4"; do
  n="$(basename "$f")"
  if at_base "$f" > "$tmp/base.$n" 2>/dev/null; then :; else
    echo "SKIP $n -- absent at the base, so there is no baseline to ratchet against" >&2
    : > "$tmp/base.$n"
    touch "$tmp/skip.$n"
  fi
  at_head "$f" > "$tmp/head.$n"
done

# The union is the assertion that actually forbids a regression: a shape may
# move between any two of the three files, but no shape may become corrupt
# that was not. Checking the files separately would let a regression hide as a
# reclassification.
#
# The text file is IN the union, and that is load-bearing rather than tidy.
# `classify_with` returns `Clean` when the text is corrupt, so a text-corrupt
# shape is structurally *unclassified* -- it is in the worst state this census
# records and, without this line, in none of the sets that gate. Fixing its
# text would then read as a fresh corruption. Design spec
# 2026-08-21-declined-run-rescan-design.md §5.1.
tq="$(basename "$queue")"; tp="$(basename "$perm")"; tt="$(basename "$text")"
for side in base head; do
  LC_ALL=C sort -u "$tmp/$side.$tq" "$tmp/$side.$tp" "$tmp/$side.$tt" > "$tmp/$side.union"
done

# The length-4 union. Two files, not three: there is no length-4 text file,
# because that tier asserts zero and carries no allowlist by design. So the
# promotion rule below -- structure queue may grow only where the text queue
# shrank -- has no length-4 form either. It exists to PERMIT a growth the union
# would otherwise forbid, and at length 4 there is no such growth to permit.
tq4="$(basename "$q4")"; tp4="$(basename "$p4")"
for side in base head; do
  LC_ALL=C sort -u "$tmp/$side.$tq4" "$tmp/$side.$tp4" > "$tmp/$side.union4"
done

fail=0
printf '%-8s %8s %8s %8s   %s\\n' set base head delta verdict
# `gate` says whether an addition to this set is a failure. The permanent file
# is reported but NOT gated here: a shape moving in from the queue is legitimate
# reclassification, and forbidding it outright would make every shape that
# cannot be fixed yet sit in the queue forever. What guards that move is the
# ceiling census.rs asserts, plus the no-gratuitous-raise check below. The union
# is what makes the move safe to allow -- it forbids a shape becoming corrupt
# that was not, so a growing permanent file can only be drawing from the queue.
check() { # label base-set head-set gate skip-marker
  local b h added n_b n_h verdict skipped
  b="$2"; h="$3"
  n_b="$(wc -l < "$b" | tr -d ' ')"; n_h="$(wc -l < "$h" | tr -d ' ')"
  added="$(comm -13 "$b" "$h")"
  verdict="ok"
  skipped=0
  if [ -n "${5:-}" ] && [ -f "$5" ]; then
    verdict="skipped (no baseline)"
    skipped=1
  elif [ -n "$added" ]; then
    local n_added
    n_added="$(printf '%s\\n' "$added" | wc -l | tr -d ' ')"
    if [ "$4" = gate ]; then
      verdict="FAIL -- $n_added added"
      fail=1
    else
      verdict="$n_added moved in (not gated)"
    fi
  fi
  printf '%-8s %8s %8s %+8d   %s\\n' "$1" "$n_b" "$n_h" "$((n_h - n_b))" "$verdict"
  # `skipped` guards this dump too: a skipped baseline reads its whole file as
  # "added" (there is nothing yet to diff against), and without this check
  # that printed ten sample shapes under a row that already says "skipped (no
  # baseline)" with no verdict explaining them -- easy to misread as a failure
  # on exactly the CI run that introduces the file.
  if [ "$4" = gate ] && [ "$skipped" -eq 0 ] && [ -n "$added" ]; then
    # `sed -n 1,10p`, not `head -10`: head closes the pipe after ten lines,
    # which SIGPIPEs the writer, and under `set -e -o pipefail` that aborted
    # this script before it could finish the table or print its summary. sed
    # reads to EOF.
    printf '%s\\n' "$added" | sed -n '1,10p' | sed 's/^/           /'
  fi
}
check text  "$tmp/base.$tt"    "$tmp/head.$tt"    gate   "$tmp/skip.$tt"
# The queue may grow only by shapes that left the text file in the same commit.
# Text-corrupt -> structure-corrupt is a promotion: text is the invariant and
# the span boundary is not, so a shape that stops losing text and starts losing
# only structure has got better. Every other queue growth still fails.
#
# This keeps the one case on record where the queue gate alone spoke (abutment
# ledger spec §2b.4): there the text file was unchanged, so `text_removed` is
# empty, every addition is unjustified, and it still fails. Both directions are
# pinned by crates/kasane-writer/tests/ratchet_gate_cases.sh.
#
# Like the union above, this does not consult skip.$tq/skip.$tt: if either
# file were ever newly introduced (absent at base), its whole content would
# read as added and this would fail loudly rather than skip. Unreached today
# -- both files predate this branch's base.
comm -23 "$tmp/base.$tt" "$tmp/head.$tt" > "$tmp/text_removed"
comm -13 "$tmp/base.$tq" "$tmp/head.$tq" > "$tmp/queue_added"
comm -23 "$tmp/queue_added" "$tmp/text_removed" > "$tmp/queue_unjustified"
check queue "$tmp/base.$tq" "$tmp/head.$tq" report "$tmp/skip.$tq"
# Printed on both outcomes, not only on failure. A gate whose only output is
# its failure message is invisible in every green run, so nobody reviewing a
# passing table can tell it ran at all -- which is the silent-gate failure
# mode this repo has now recorded twice.
n_unjust="$(wc -l < "$tmp/queue_unjustified" | tr -d ' ')"
if [ -s "$tmp/queue_unjustified" ]; then
  fail=1
  printf '%-8s %8s %8s %+8d   %s\\n' "queue+" "" "" \\
    "$n_unjust" "FAIL -- queue growth with no matching text removal"
  sed -n '1,10p' "$tmp/queue_unjustified" | sed 's/^/           /'
else
  printf '%-8s %8s %8s %+8d   %s\\n' "queue+" "" "" 0 "ok"
fi
check perm  "$tmp/base.$tp"    "$tmp/head.$tp"    report ""
check union "$tmp/base.union"  "$tmp/head.union"  gate   ""

# The length-4 union skips while either of its files is absent at the base.
# Unlike the length-3 files, these were introduced by the branch that added the
# length-4 structural tier -- so on that branch, and on any branch whose merge
# base predates it, the whole file reads as added and an ungated skip-less check
# would fail on its own introduction. The marker disappears on the first merge
# base that has both files, after which this gates like any other.
if [ -f "$tmp/skip.$tq4" ] || [ -f "$tmp/skip.$tp4" ]; then
  touch "$tmp/skip.union4"
fi
check queue4 "$tmp/base.$tq4"   "$tmp/head.$tq4"   report "$tmp/skip.$tq4"
check perm4  "$tmp/base.$tp4"   "$tmp/head.$tp4"   report "$tmp/skip.$tp4"
check union4 "$tmp/base.union4" "$tmp/head.union4" gate   "$tmp/skip.union4"

# The length-5 counts. Three rows, one gate.
#
# `union5` is gated and the other two are reported, which is the length-3/4
# logic reproduced rather than a new rule: there, "the union is what makes the
# move safe to allow". `perm5` growing while `union5` is flat IS queue ->
# permanent movement; `perm5` growing while `union5` grows fails on `union5`.
# So the permanence ceiling has no length-5 form -- there is no set difference
# to compute "newly permanent" from, and none is needed.
#
# Accuracy is inherited from `mise run census-len5`, which asserts this file
# still describes the writer. That step runs BEFORE this one in ci.yml for the
# same reason the Test step already does: run first, this could pass on a file
# the tier was about to reject. A hand-edited `union 1204311` sails through
# here -- the union shrank -- and only that tier catches the lie.
count_check() { # label key gate
  local b h verdict
  if ! b="$(count_at "$2" "$counts5" "$base")"; then
    printf '%-8s %8s %8s %8s   %s\\n' "$1" "" "" "" "skipped (no baseline)"
    return 0
  fi
  if ! h="$(count_at "$2" "$counts5" "")"; then
    echo "FAIL $1: $counts5 is missing its '$2' line at HEAD." >&2
    fail=1
    return 0
  fi
  verdict="ok"
  if [ "$h" -gt "$b" ]; then
    if [ "$3" = gate ]; then
      verdict="FAIL -- $((h - b)) added"
      fail=1
    else
      verdict="$((h - b)) moved in (not gated)"
    fi
  fi
  printf '%-8s %8s %8s %+8d   %s\\n' "$1" "$b" "$h" "$((h - b))" "$verdict"
}
count_check queue5 queue     report
count_check perm5  permanent report
count_check union5 union     gate

# A raise is how a human states "these shapes can never be fixed", so it must
# come with shapes that actually moved in. Without this, the number could drift
# upward and pre-authorise a later bless -- precisely the reviewable moment the
# ceiling exists to create. Written once and called per length, because two
# copies would drift the way the census's own helpers were about to.
ceiling_check() { # label ceiling-path base-perm head-perm
  local label="$1" cpath="$2" bperm="$3" hperm="$4" cb ch grew
  if ! git cat-file -e "$base:$cpath" 2>/dev/null; then
    echo "ceiling($label): absent at the base -- introduced by this change, nothing to compare"
    return 0
  fi
  cb="$(git show "$base:$cpath" | tr -d '[:space:]')"
  ch="$(tr -d '[:space:]' < "$cpath")"
  grew="$(comm -13 "$bperm" "$hperm" | wc -l | tr -d ' ')"
  if [ "$ch" -gt "$cb" ] && [ "$grew" -eq 0 ]; then
    echo "FAIL ceiling($label) raised $cb -> $ch with no shape newly claimed inexpressible." >&2
    echo "     A raise is a permanence claim; make it in the commit that needs it." >&2
    fail=1
    return 0
  fi
  echo "ceiling($label): $cb -> $ch ($grew shape(s) newly permanent)"
}

echo
ceiling_check len3 "$ceil"  "$tmp/base.$tp"  "$tmp/head.$tp"
ceiling_check len4 "$ceil4" "$tmp/base.$tp4" "$tmp/head.$tp4"

echo
if [ "$fail" -ne 0 ]; then
  echo "census ratchet FAILED: the allowlists may only shrink against main." >&2
  exit 1
fi
echo "census ratchet ok"
"""

# The ratchet gates' *negative* directions. `census-ratchet` above only ever
# runs in the direction that passes, and a gate exercised only where it
# succeeds is indistinguishable from a gate that always succeeds -- the
# silent-gate failure mode this repo has now recorded twice. Since 2026-08-25
# every gate the table prints has a direction there: the length-3 queue gate,
# against a growth with no matching text removal (the case abutment ledger spec
# §2b.4 recorded); both unions, against any growth at all (neither has a
# promotion rule to excuse one); and both ceilings, against a raise with no
# shape newly claimed permanent. Each asserts the row -- or, for the ceilings,
# the line -- its own gate prints, because nine rows can fail this task and an
# exit status cannot say which one did.
#
# One direction asserts a PASS rather than a failure: a ceiling raise that is
# justified, one shape promoted out of the queue in the same change. The
# ceiling is the only gate here whose predicate has two terms, and without that
# direction a check that rejected every raise -- legitimate ones included --
# would look identical to the correct one.
#
# Safe to run anywhere, CI included: it mutates tracked census files -- one per
# direction, three for the promotion case -- then restores every one of them
# inside its own EXIT trap ahead of the trap's cleanup, and the restore is
# checked rather than silenced. The restore path is exercised on every run,
# which is what earns it that trust.
[tasks.census-ratchet-cases]
description = "The census gates' negative directions, against real history"
run = "crates/kasane-writer/tests/ratchet_gate_cases.sh"

[tasks.fuzz]
description = "Fuzz one target: mise run fuzz <target> [-- -max_total_time=60]"
run = """
#!/usr/bin/env bash
set -euo pipefail
target="$1"; shift || true
mkdir -p "fuzz/corpus/$target"
# Seed per target (design spec §5). The per-format and ZIP targets get their own
# format's fixtures; detect gets everything; the sub-parser targets take seeds
# only -- an EPUB archive is not a useful starting input for palmdoc.
case "$target" in
  epub|epub_zip) cp -f tests/fixtures/epub/*.epub "fuzz/corpus/$target/" 2>/dev/null || true ;;
  pptx|pptx_zip) cp -f tests/fixtures/pptx/*.pptx "fuzz/corpus/$target/" 2>/dev/null || true ;;
  mobi)          cp -f tests/fixtures/mobi/*.mobi tests/fixtures/azw3/*.azw3 "fuzz/corpus/$target/" 2>/dev/null || true ;;
  pdf)           cp -f tests/fixtures/pdf/*.pdf "fuzz/corpus/$target/" 2>/dev/null || true ;;
  djvu)          cp -f tests/fixtures/djvu/*.djvu "fuzz/corpus/$target/" 2>/dev/null || true ;;
  detect)        find tests/fixtures -type f ! -name '*.py' ! -name '*.md' -exec cp -f {} "fuzz/corpus/$target/" \\; 2>/dev/null || true ;;
esac
if [ -d "fuzz/seeds/$target" ]; then cp -f "fuzz/seeds/$target/"* "fuzz/corpus/$target/" 2>/dev/null || true; fi
# A renamed/moved fixtures or seeds dir would otherwise fail silently above
# (the `|| true` swallows exactly that). Warn, don't fail: some targets
# legitimately have no fixtures (e.g. detect with an empty tests/fixtures).
if [ -z "$(ls -A "fuzz/corpus/$target" 2>/dev/null)" ]; then
  echo "WARNING: fuzz/corpus/$target is empty -- no seeds found for '$target'" >&2
fi
cargo "+$KASANE_FUZZ_TOOLCHAIN" fuzz run "$target" "fuzz/corpus/$target" -- \\
  -rss_limit_mb=2048 -malloc_limit_mb=2048 -timeout=25 "$@"
"""

[tasks.fuzz-all]
description = "Fuzz every target for 5 minutes each"
run = """
#!/usr/bin/env bash
set -euo pipefail
for t in epub pptx mobi pdf djvu epub_zip pptx_zip detect math_island palmdoc guards xmltext slug escape; do
  echo "=== $t ==="
  mise run fuzz "$t" -- -max_total_time=300
done
"""
