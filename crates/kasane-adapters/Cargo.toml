[package]
name = "kasane-adapters"
description = "Format detection and parsers (EPUB, PPTX) for the kasane document converter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kasane-ir.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
roxmltree = "0.20"
thiserror = "1"
html5ever = "0.33"
markup5ever_rcdom = "0.5.4-unofficial"
mobi = "0.8"
lopdf = { version = "0.44", default-features = false }
png = "0.18"
djvu-rs = "0.27"
leptess = { version = "0.14", optional = true }

[dev-dependencies]
# For the end-to-end pipeline test in this crate's own `#[cfg(test)]` module
# (`src/lib.rs`), which exercises `kasane_core::structure` and
# `kasane_core::Options` directly.
kasane-core.workspace = true
# For `tests/fuzz_corpus.rs` only: the `slug` target's seam lives in
# kasane-gfm, and this file is the one replay harness for every target.
# Test-scoped, so it does not put gfm in the adapter crate's real dependency
# graph, and acyclic -- gfm depends on kasane-ir alone.
kasane-gfm.workspace = true
kasane-writer.workspace = true
tempfile = "3"

[features]
ocr = ["dep:leptess"]

[lints]
workspace = true
