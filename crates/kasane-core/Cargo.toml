[package]
name = "kasane-core"
description = "Pure structuring engine for kasane: fold, balance, paths, refs, nav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kasane-ir.workspace = true
# NFC (for `path_slug` only -- `anchor_slug` must not normalize; see
# `slug.rs`), and the General_Category tables behind Ruby's `\p{Word}`. std
# cannot answer either question these ask: `char::is_alphanumeric()` is
# Alphabetic + Numeric, so it neither keeps the Devanagari virama (U+094D), a
# separate Mark that NFC does not compose away -- `हिन्दी` would slug to
# `हिनदी` -- nor tells `Nd` from `No`, which Ruby's set turns on.
# `default-features = false` drops the emoji tables, which nothing here needs.
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[lints]
workspace = true
