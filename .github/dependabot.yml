version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Required, not optional. The workflows pin actions by commit SHA, and a SHA
  # pin never updates itself — without this, those pins silently rot and stop
  # receiving upstream security fixes. Dependabot reads the version from the
  # trailing comment next to each SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # fuzz/ is a separate cargo workspace with its own lockfile, so the `/` entry
  # above does not see it and `cargo deny check advisories` in audit.yml does
  # not scan it. These are dev-only dependencies that never ship in the released
  # binary, but they still get update PRs.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
