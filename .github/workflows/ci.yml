name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the in-flight run irrelevant. Cancel it
# rather than paying for a result nobody will read. Never cancel on main:
# those runs are the record of what actually landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # `mise run census-ratchet` resolves a merge base with main, which the
          # default shallow fetch cannot reach. Full history here rather than a
          # deeper-but-bounded fetch: a bound is a guess about how far a branch
          # has diverged, and getting it wrong fails the ratchet on a stale
          # branch rather than on a regression.
          fetch-depth: 0

      # Installs the exact toolchain pinned in mise.toml, so CI and a laptop
      # resolve from one file and cannot drift.
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      # Before "Census ratchet", not after, and for the same reason that step
      # already runs after Test: the ratchet compares census-len5-counts.txt
      # across revisions and takes its ACCURACY on trust. A hand-edited
      # `union 1204311` sails through the ratchet -- the union shrank -- and
      # only this tier's own assertion catches the lie.
      #
      # Release profile, ~35s. In debug the same three tests take ~3.3 min for
      # the same answer, which is why they are #[ignore]d out of `mise run test`.
      - name: Census length 5
        run: mise run census-len5

      # After Test, not before: this compares the committed allowlists across
      # revisions and takes their accuracy on trust, which is only earned once
      # census.rs has asserted that they match what the writer actually does.
      # Run first, it could pass on files the test was about to reject.
      - name: Census ratchet
        run: mise run census-ratchet

      # Directions 2-8. The step above only ever runs the gates where they
      # pass, and a gate exercised only in its passing direction is the
      # silent-gate failure mode this repo has recorded twice. This one drives
      # every gate that step prints into failure -- both queues' rules, all
      # three unions, both ceilings -- and fails if any accepts the injection. One
      # direction goes the other way, requiring a justified ceiling raise to
      # pass, because the ceiling is the only gate here whose predicate has two
      # terms. It mutates tracked census files and restores every one of them
      # in its own EXIT trap, checked rather than silenced, so the restore is
      # exercised on every run.
      - name: Census ratchet, negative directions
        run: mise run census-ratchet-cases

  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # OCR is the one feature that links C: Tesseract + Leptonica + the English
      # traineddata. Installed here (not via mise) because they are system C
      # libraries, mirroring how a user building `-F ocr` provisions them.
      - name: Install Tesseract and Leptonica
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev tesseract-ocr-eng clang

      - name: Lint (ocr feature)
        run: mise run lint-ocr

      - name: Test (ocr feature)
        run: mise run test-ocr
