name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the in-flight run irrelevant. Cancel it
# rather than paying for a result nobody will read. Never cancel on main:
# those runs are the record of what actually landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # `mise run census-ratchet` resolves a merge base with main, which the
          # default shallow fetch cannot reach. Full history here rather than a
          # deeper-but-bounded fetch: a bound is a guess about how far a branch
          # has diverged, and getting it wrong fails the ratchet on a stale
          # branch rather than on a regression.
          fetch-depth: 0

      # Installs the exact toolchain pinned in mise.toml, so CI and a laptop
      # resolve from one file and cannot drift.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      # After Test, not before: this compares the committed allowlists across
      # revisions and takes their accuracy on trust, which is only earned once
      # census.rs has asserted that they match what the writer actually does.
      # Run first, it could pass on files the test was about to reject.
      - name: Census ratchet
        run: mise run census-ratchet

      # Direction 2. The step above only ever runs the gate where it passes,
      # and a gate exercised only in its passing direction is the silent-gate
      # failure mode this repo has recorded twice. This one injects an
      # unjustified queue growth and fails if the gate accepts it. It mutates a
      # tracked census file and restores it in its own EXIT trap, checked
      # rather than silenced, so the restore is exercised on every run.
      - name: Census ratchet, negative direction
        run: mise run census-ratchet-cases

  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # OCR is the one feature that links C: Tesseract + Leptonica + the English
      # traineddata. Installed here (not via mise) because they are system C
      # libraries, mirroring how a user building `-F ocr` provisions them.
      - name: Install Tesseract and Leptonica
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev tesseract-ocr-eng clang

      - name: Lint (ocr feature)
        run: mise run lint-ocr

      - name: Test (ocr feature)
        run: mise run test-ocr
